plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kalispark'
    compileSdk 34

    defaultConfig {
        applicationId "com.kalispark"
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
